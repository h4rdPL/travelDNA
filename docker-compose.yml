services:
  traveldna-api:
    container_name: traveldna-api
    build:
      context: .
      dockerfile: src/TravelDNA.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=traveldna-db;Port=5432;Database=traveldna;Username=traveldna;Password=${POSTGRES_PASSWORD:-dev_only_change_me}"
    ports:
      - "8080:8080"
    depends_on:
      traveldna-db:
        condition: service_healthy
    restart: unless-stopped

  traveldna-db:
    container_name: traveldna-db
    image: postgres:17
    environment:
      POSTGRES_DB: traveldna
      POSTGRES_USER: traveldna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - traveldna-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveldna -d traveldna"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  traveldna-postgres-data: